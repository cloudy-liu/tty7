schema_version: 1
id: blue-paper
name: Blue Paper
author: tty7 contributors (adapted from Paperglow)
description: Example package with blue links and a narrower reading column.
license: Apache-2.0
typography:
  fonts: [Montserrat, Segoe UI, Helvetica Neue, Arial, Noto Sans SC, PingFang SC, Microsoft YaHei]
  code_fonts: []
  font_size: 17
  code_size: 14
  line_height: 1.5
  heading_sizes: [32, 27, 23, 20, 18, 17]
  heading_weights: [700, 600, 500, 500, 500, 500]
  heading_line_height: 1.4
  paragraph_gap: 17
  heading_gap: 24
layout:
  max_width: 960
  compact_below: 800
  outer_padding: 24
  padding: 48
  compact_padding: 20
  radius: 16
  shadow_blur: 22
  shadow_offset: 10
  code_padding: 18
  code_radius: 16
  quote_padding: 16
  quote_border: 3
  quote_radius: 8
  table_padding: 8
  list_gap: 4
